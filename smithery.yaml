# Smithery configuration for SEFAZ CE: IPVA
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_ce_ipva

name: sefaz_ce_ipva-mcp
displayName: "SEFAZ CE: IPVA"
description: >
  SEFAZ CE: IPVA, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_ce_ipva-mcp
repository: https://github.com/mcp-dir/sefaz_ce_ipva-mcp

tags:
  - sefaz_ce_ipva
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_ce_ipva

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_ce_ipva/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
